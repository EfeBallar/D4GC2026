<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library Gaps</title>
<style>
:root{--bg:#f6f5f3;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e1dd;--red:#e2001a;--red-soft:#fde8ea}


*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{width:28px;height:28px;border-radius:6px;background:var(--red);display:grid;place-items:center;color:#fff;font-weight:800}
h1{font-size:17px;margin:0}header a{margin-left:auto;color:var(--ink);font-size:13px}
main{max-width:860px;margin:0 auto;padding:16px}.meta{color:var(--mute);font-size:13px;margin:0 2px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
h2{font-size:15px;margin:0 0 8px}.terms{display:flex;flex-wrap:wrap;gap:6px}
.t{background:var(--red-soft);color:var(--red);border-radius:6px;padding:2px 9px;font-size:13px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
td.n{color:var(--mute);white-space:nowrap;width:1%}td a{color:var(--ink)}.empty{color:var(--mute)}
</style>
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<script src="/static/nav.js"></script>
<h1 style="max-width:980px;margin:18px auto 0;padding:0 16px">Library gaps</h1>
<main>
  <p class="meta" id="sum">loading…</p>
  <div class="card"><h2>Terms the library has never seen</h2><div class="terms" id="terms"></div></div>
  <div class="card"><h2>Most repeated unanswered searches</h2><table id="top"></table></div>
  <div class="card"><h2>Latest</h2><table id="recent"></table></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const q=s=>`<a href="/?q=${encodeURIComponent(s)}">${esc(s)}</a>`;
fetch("/api/gaps").then(r=>r.json()).then(g=>{
  $("#sum").textContent=`${g.unanswered} searches found no reliable match (${g.distinct_queries} distinct). This log goes back to HQ with the next sync, so the next update can fill these gaps.`;
  $("#terms").innerHTML=g.top_unknown_terms.length?g.top_unknown_terms.map(([t,n])=>`<span class="t">${esc(t)} · ${n}</span>`).join(""):`<span class="empty">None yet.</span>`;
  $("#top").innerHTML=g.top_queries.map(x=>`<tr><td class="n">${x.count}×</td><td dir="auto">${q(x.query)}</td><td class="n">${esc(x.last_seen)}</td></tr>`).join("")||`<tr><td class="empty">None yet.</td></tr>`;
  $("#recent").innerHTML=g.recent.map(x=>`<tr><td class="n">${esc(x.ts)}</td><td dir="auto">${q(x.query)}</td><td class="n">${esc((x.unknown_terms||[]).join(", "))}</td></tr>`).join("")||`<tr><td class="empty">None yet.</td></tr>`;
}).catch(()=>{$("#sum").textContent="server not reachable"});
</script>
</body>
</html>
